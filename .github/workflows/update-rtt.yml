name: Update NHS RTT data

on:
  # Started by the monthly laptop task, which finds the link in a real browser.
  # The old cron schedule was removed: NHS England's browser check blocks
  # the script from finding links on its own, so scheduled runs only failed.
  workflow_dispatch:
    inputs:
      csv_zip_url:
        description: 'Full CSV data file (ZIP) link from the NHS England RTT page'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_and_process_rtt.py
        env:
          RTT_ZIP_URL: ${{ inputs.csv_zip_url }}

      - name: Build link-preview images and share pages
        run: python scripts/build_share_cards.py

      - name: Commit updated data (if any)
        run: |
          git config user.name "rtt-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/og docs/t
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NHS RTT data $(date -u +%Y-%m-%d)"
            git push
          fi
