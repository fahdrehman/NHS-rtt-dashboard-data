name: Update NHS RTT data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 15 * *'
    - cron: '0 8 20 * *'
    - cron: '0 8 25 * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_and_process_rtt.py

      - name: Commit updated data (if any)
        run: |
          git config user.name "rtt-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update NHS RTT data $(date -u +%Y-%m-%d)"
            git push
          fi
